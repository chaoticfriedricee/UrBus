databases:
  - name: urbus-postgres
    plan: free
    databaseName: urbus_users
    user: urbus

services:
  - type: web
    name: urbus-auth-service
    runtime: docker
    dockerfilePath: ./dockerfiles/Dockerfile.auth-service
    dockerContext: ./authentication-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: urbus-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: urbus-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: urbus-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: urbus-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: urbus-postgres
          property: password
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: JWT_ISSUER
        value: UrBus
      - key: JWT_AUDIENCE
        value: UrBus
      - key: JWT_EXPIRATION_MINUTES
        value: "60"
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_ALLOWED_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_BASE_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        sync: false
      - key: CLOUDINARY_DEFAULT_AVATAR
        sync: false
      - key: SMTP_ENABLED
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USE_IMPLICIT_SSL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        sync: false

  - type: web
    name: urbus-passenger-service
    runtime: docker
    dockerfilePath: ./dockerfiles/Dockerfile.passenger-service
    dockerContext: ./passenger-service
    plan: free
    healthCheckPath: /urbus/v1/health
    envVars:
      - key: URI_MONGODB
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: JWT_ISSUER
        value: UrBus
      - key: JWT_AUDIENCE
        value: UrBus

  - type: web
    name: urbus-post-service
    runtime: docker
    dockerfilePath: ./dockerfiles/Dockerfile.post-service
    dockerContext: ./post-service
    plan: free
    healthCheckPath: /urbus/v1/health
    envVars:
      - key: URI_MONGODB
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: JWT_ISSUER
        value: UrBus
      - key: JWT_AUDIENCE
        value: UrBus
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PASSENGER_SERVICE_URL
        sync: false

  - type: web
    name: urbus-location-service
    runtime: docker
    dockerfilePath: ./dockerfiles/Dockerfile.location-service
    dockerContext: ./location-service
    plan: free
    healthCheckPath: /urbus/v1/health
    envVars:
      - key: URI_MONGODB
        sync: false
      - key: PASSENGER_SERVICE_URL
        sync: false