services:
  postgres:
    image: postgres:13
    container_name: urbus_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - urbus_network
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: urbus_mongo
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - urbus_network
    restart: unless-stopped

  authentication-service:
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.auth-service
    container_name: urbus_authentication_service
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${AUTH_PORT}
      FRONTEND_URL: ${FRONTEND_URL}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_LOGGING: ${DB_LOGGING}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_BASE_URL: ${CLOUDINARY_BASE_URL}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER}
      CLOUDINARY_DEFAULT_AVATAR: ${CLOUDINARY_DEFAULT_AVATAR}
      SMTP_ENABLED: ${SMTP_ENABLED}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USE_IMPLICIT_SSL: ${SMTP_USE_IMPLICIT_SSL}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS}
      SMTP_USE_FALLBACK: ${SMTP_USE_FALLBACK}
      SMTP_IGNORE_CERTIFICATE_ERRORS: ${SMTP_IGNORE_CERTIFICATE_ERRORS}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS}
      AUTH_RATE_LIMIT_WINDOW_MINUTES: ${AUTH_RATE_LIMIT_WINDOW_MINUTES}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX}
      API_RATE_LIMIT_WINDOW_MINUTES: ${API_RATE_LIMIT_WINDOW_MINUTES}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX}
    ports:
      - "${AUTH_PORT}:5166"
    depends_on:
      - postgres
    networks:
      - urbus_network
    restart: unless-stopped

  location-service:
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.location-service
    container_name: urbus_location_service
    environment:
      PORT: ${LOCATION_PORT}
      URI_MONGODB: mongodb://mongo:27017/UrBus
    volumes:
      - ./location-service:/app
      - /app/node_modules
    ports:
      - "${LOCATION_PORT}:${LOCATION_PORT}"
    depends_on:
      - mongo
    networks:
      - urbus_network
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.notification-service
    container_name: urbus_notification_service
    environment:
      PORT: ${NOTIFICATION_PORT}
      URI_MONGODB: mongodb://mongo:27017/notifications
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
    volumes:
      - ./notification-service:/app
      - /app/node_modules
    ports:
      - "${NOTIFICATION_HOST_PORT}:${NOTIFICATION_PORT}"
    depends_on:
      - mongo
    networks:
      - urbus_network
    restart: unless-stopped

  passenger-service:
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.passenger-service
    container_name: urbus_passenger_service
    environment:
      PORT: ${PASSENGER_PORT}
      URI_MONGODB: mongodb://mongo:27017/passenger
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
    volumes:
      - ./passenger-service:/app
      - /app/node_modules
    ports:
      - "${PASSENGER_PORT}:${PASSENGER_PORT}"
    depends_on:
      - mongo
    networks:
      - urbus_network
    restart: unless-stopped

  post-service:
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.post-service
    container_name: urbus_post_service
    environment:
      PORT: ${POST_PORT}
      URI_MONGODB: mongodb://mongo:27017/urbus_posts
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    volumes:
      - ./post-service:/app
      - /app/node_modules
    ports:
      - "${POST_PORT}:${POST_PORT}"
    depends_on:
      - mongo
    networks:
      - urbus_network
    restart: unless-stopped

  client-admin:
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.client-admin
      args:
        VITE_LOCATION_SERVICE_URL: ${VITE_LOCATION_SERVICE_URL}
        VITE_AUTH_URL: ${VITE_AUTH_URL}
        VITE_POST_URL: ${VITE_POST_URL}
        VITE_PASSENGER_URL: ${VITE_PASSENGER_URL}
        VITE_NOTIFICATION_URL: ${VITE_NOTIFICATION_URL}
    container_name: urbus_client_admin
    environment:
      PORT: ${CLIENT_ADMIN_PORT}
      VITE_LOCATION_SERVICE_URL: ${VITE_LOCATION_SERVICE_URL}
      VITE_AUTH_URL: ${VITE_AUTH_URL}
      VITE_POST_URL: ${VITE_POST_URL}
      VITE_PASSENGER_URL: ${VITE_PASSENGER_URL}
      VITE_NOTIFICATION_URL: ${VITE_NOTIFICATION_URL}
    volumes:
      - ./client-admin:/app
      - /app/node_modules
    ports:
      - "${CLIENT_ADMIN_PORT}:${CLIENT_ADMIN_PORT}"
    depends_on:
      - authentication-service
      - location-service
      - notification-service
      - passenger-service
      - post-service
    networks:
      - urbus_network
    restart: unless-stopped

networks:
  urbus_network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
