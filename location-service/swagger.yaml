openapi: 3.0.3
info:
  title: UrBus Location Service API
  description: |
    Microservicio de rastreo de ubicación en tiempo real para la plataforma UrBus.

    Combina una API HTTP REST y una capa de **WebSockets via Socket.IO** para transmitir
    la ubicación del bus en tiempo real a todos los clientes conectados.

    El mapa se renderiza con **Leaflet.js + OpenStreetMap** directamente desde este servicio.

    ---

    ## Arquitectura

    ```
    Conductor (navegador)
        │
        ├── navigator.geolocation.watchPosition()
        │       └── socket.emit("busLocation", { lat, lng })
        │                           │
        │               Socket.IO Server
        │       io.to("driver:<id>").emit("updateBus", coords)
        │                           │
        └── Pasajeros de sus grupos ← reciben coordenadas en tiempo real
    ```

    ---

    ## WebSocket — Eventos Socket.IO

    Conectarse al servidor Socket.IO en la raíz del servidor (sin path especial):

    ```javascript
    const socket = io("http://localhost:PORT", { auth: { token: accessToken } });
    ```

    La conexión exige el access token JWT. location-service consulta
    `GET /groups/access` de passenger-service (variable `PASSENGER_SERVICE_URL`)
    y rechaza la conexión con `UNAUTHORIZED` si el token no es válido.

    - Cada conductor tiene una sala propia; entran él y los pasajeros de sus
      grupos activos. Nadie más recibe su ubicación.
    - Solo se guarda en memoria la última posición de quien comparte; no hay historial.

    ### Eventos emitidos por el cliente (solo `DRIVER_ROLE`)

    **`startSharing`** — el conductor empieza a compartir su ubicación.

    **`stopSharing`** — deja de compartirla (de inmediato).

    Si el conductor se desconecta sin `stopSharing` (app en segundo plano, pantalla
    bloqueada, cambio de red), la ruta queda **en pausa** durante
    `LOCATION_SHARING_GRACE_MS` (5 minutos por defecto): los pasajeros reciben
    `locationStatus` con `paused: true` y la última posición conocida. Si el conductor
    se reconecta y vuelve a emitir `startSharing`, la ruta continúa; si no, termina sola.

    **`busLocation`**
    Envía la ubicación GPS actual del bus al servidor. Se ignora si el conductor
    no emitió antes `startSharing`, o si la emite un pasajero.

    ```javascript
    socket.volatile.emit("busLocation", {
      lat: 14.6258,
      lng: -90.5366,
      timestamp: position.timestamp
    });
    ```

    | Campo     | Tipo   | Descripción |
    |-----------|--------|-------------|
    | lat       | number | Latitud GPS del bus |
    | lng       | number | Longitud GPS del bus |
    | timestamp | number | Opcional. Momento (ms, reloj del conductor) en que el GPS tomó la posición. Se descartan posiciones con un `timestamp` igual o anterior al último recibido en la ruta, para no mover el bus hacia atrás con posiciones repetidas o reenviadas. |

    Se recomienda `volatile` para no acumular posiciones mientras no hay conexión.

    ---

    ### Eventos emitidos por el servidor (solo a la sala del conductor)

    **`locationStatus`**
    Se envía al conectar y cada vez que el conductor empieza, pausa o deja de compartir:
    `{ sharing: boolean, paused?, lat?, lng?, updatedAt?, ageMs?, reason? }`.
    - `reason: "NO_GROUP"`: el usuario no pertenece a ningún grupo activo (o es admin).
    - `paused: true`: el conductor perdió la conexión; `lat`/`lng` son solo la última
      posición conocida y no deben mostrarse como ubicación en vivo.
    - `ageMs`: antigüedad de esa posición al enviarse el evento (no depende de que el
      reloj del dispositivo coincida con el del servidor).

    **`updateBus`**
    Se emite a la sala del conductor cada vez que envía una nueva ubicación.

    ```javascript
    socket.on("updateBus", (coords) => {
      // coords = { lat: number, lng: number, updatedAt: string }
      busMarker.setLatLng([coords.lat, coords.lng]);
    });
    ```

    ---

    **`busArrived`**
    Se emite una única vez cuando el bus llega a las coordenadas de Kinal
    dentro de una tolerancia de ~20 metros (0.0002 grados).

    Coordenadas de destino: `lat 14.6258, lng -90.5360`

    ```javascript
    socket.on("busArrived", () => {
      // mostrar notificación de llegada
    });
    ```

    Se emite una vez por llegada y por conductor; se rearma cuando el bus sale de Kinal.

    ---

    ## Mapa Leaflet

    La vista principal (`GET /urbus/v1/`) renderiza un mapa interactivo con:
    - Tile layer de OpenStreetMap
    - Marcador fijo en Kinal (lat 14.6245, lng -90.5366)
    - Marcador dinámico del bus (emoji 🚌) actualizado via WebSocket
    - Detección de llegada a Kinal con tolerancia de 50 metros (Haversine)
  version: 1.0.0

servers:
  - url: http://localhost:{port}/urbus/v1
    description: Local development
    variables:
      port:
        default: '3033'

tags:
  - name: Health
    description: Estado del servicio
  - name: Map
    description: Interfaz del mapa Leaflet

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: UrBus Location Service

  /:
    get:
      tags:
        - Map
      summary: Vista del mapa de rastreo
      operationId: getMapView
      description: |
        Renderiza la página HTML con el mapa Leaflet + OpenStreetMap.
        Es una vista pública sin sesión: ya no transmite el GPS del visitante y
        la ubicación del bus solo está disponible en las apps de UrBus.
      responses:
        '200':
          description: HTML con el mapa Leaflet renderizado
          content:
            text/html:
              schema:
                type: string
                description: Página HTML con mapa interactivo

  /css/main.css:
    get:
      tags:
        - Map
      summary: Estilos del mapa
      operationId: getStyles
      responses:
        '200':
          description: Hoja de estilos CSS
          content:
            text/css:
              schema:
                type: string

  /js/main.js:
    get:
      tags:
        - Map
      summary: Script del mapa
      operationId: getScript
      description: Script que inicializa el mapa Leaflet, conecta el Socket.IO y maneja la geolocalización.
      responses:
        '200':
          description: JavaScript del mapa
          content:
            application/javascript:
              schema:
                type: string

components:
  schemas:
    BusCoords:
      type: object
      description: Coordenadas GPS del bus
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          format: double
          description: Latitud GPS
          example: 14.6258
        lng:
          type: number
          format: double
          description: Longitud GPS
          example: -90.5366

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: UrBus Location Service