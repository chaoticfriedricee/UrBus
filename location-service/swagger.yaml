openapi: 3.0.3
info:
  title: UrBus Location Service API
  description: |
    API REST y Socket.IO para recorridos GPS de UrBus. La ruta configurada y el historial
    pertenecen a cada grupo (`groupId`); Kinal es el destino inicial. El conductor inicia
    manualmente, el origen se toma del GPS actual y OSRM calcula la ruta driving.

    La persistencia usa MongoDB (`URI_MONGODB`). Cada grupo admite como máximo un
    recorrido `EN_CURSO`; los recorridos completados e interrumpidos permanecen en el
    historial. Los canales Socket.IO son salas por grupo y todos los comandos de escritura
    validan el rol y la pertenencia al grupo en el servidor.

    Socket.IO conecta a la raíz del servicio:
    `io("http://localhost:3033", { auth: { token: accessToken } })`.

    Los comandos del conductor incluyen `itinerary:start`, `itinerary:destination`,
    `itinerary:location` e `itinerary:interrupt`. Los pasajeros solo pueden suscribirse
    al grupo que les asigna passenger-service. `itinerary:subscribe` devuelve el estado
    persistido al conectar o reconectar; `itinerary:sync` permite consultarlo de nuevo
    sin cambiar la sala.

    Eventos de difusión por sala: `itinerary:state`, `itinerary:started`,
    `itinerary:destination`, `itinerary:location`, `itinerary:route`,
    `itinerary:completed`, `itinerary:interrupted`, `itinerary:gps-status`.

    `GET /urbus/v1/` es una página informativa sin ubicación de pasajeros ni comandos
    GPS; el seguimiento requiere una sesión autenticada en las aplicaciones UrBus.
  version: 1.0.0

servers:
  - url: http://localhost:{port}/urbus/v1
    description: Local development
    variables:
      port:
        default: '3033'

tags:
  - name: Health
    description: Estado del servicio
  - name: Itineraries
    description: Rutas configuradas por grupo y recorridos
  - name: Map
    description: Página informativa MapLibre

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: UrBus Location Service

  /:
    get:
      tags:
        - Map
      summary: Vista pública informativa del mapa
      operationId: getMapView
      description: |
        Renderiza una página informativa con MapLibre. No transmite ni expone
        ubicaciones; el seguimiento requiere autenticación en las aplicaciones UrBus.
      responses:
        '200':
          description: HTML con el mapa MapLibre renderizado
          content:
            text/html:
              schema:
                type: string
                description: Página informativa del mapa

  /css/main.css:
    get:
      tags:
        - Map
      summary: Estilos de la página informativa
      operationId: getStyles
      responses:
        '200':
          description: Hoja de estilos CSS
          content:
            text/css:
              schema:
                type: string

  /js/main.js:
    get:
      tags:
        - Map
      summary: Inicializador del mapa informativo
      operationId: getScript
      description: Inicializa el mapa MapLibre sin conectarse a Socket.IO ni solicitar ubicación.
      responses:
        '200':
          description: JavaScript del mapa
          content:
            application/javascript:
              schema:
                type: string

  /itineraries/access:
    get:
      tags:
        - Itineraries
      summary: Grupos disponibles para el usuario autenticado
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Identidad y grupos autorizados
        '401':
          description: Token inválido

  /itineraries/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Itineraries
      summary: Estado de ruta y recorrido del grupo
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Configuración, recorrido activo y última instancia
        '403':
          description: El usuario no pertenece al grupo
    put:
      tags:
        - Itineraries
      summary: Actualiza el destino del grupo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination]
              properties:
                destination:
                  $ref: '#/components/schemas/Coordinate'
      responses:
        '200':
          description: Destino guardado y ruta activa recalculada si aplica
        '403':
          description: Solo el conductor asignado puede modificar el destino
        '409':
          description: No hay señal GPS actual para recalcular una ruta activa

  /itineraries/{groupId}/trips:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Itineraries
      summary: Historial de recorridos del grupo
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Recorridos ordenados del más reciente al más antiguo
    post:
      tags:
        - Itineraries
      summary: Inicia un recorrido manual desde el GPS actual
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin]
              properties:
                origin:
                  $ref: '#/components/schemas/Coordinate'
                vehicleId:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Recorrido iniciado y ruta OSRM almacenada
        '409':
          description: Ya existe un recorrido activo para el grupo

  /itineraries/{groupId}/trips/interrupt:
    post:
      tags:
        - Itineraries
      summary: Interrumpe el recorrido activo
      security:
        - BearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recorrido guardado como INTERRUMPIDO
        '409':
          description: No hay un recorrido activo

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Coordinate:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    BusCoords:
      type: object
      description: Coordenadas GPS del bus
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          format: double
          description: Latitud GPS
          example: 14.6258
        lng:
          type: number
          format: double
          description: Longitud GPS
          example: -90.5366

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: UrBus Location Service