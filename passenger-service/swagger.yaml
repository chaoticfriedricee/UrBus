openapi: 3.0.3
info:
  title: UrBus Passenger Service API
  description: |
    Microservicio de gestión de pasajeros para la plataforma UrBus.

    ## Autenticación
    Todos los endpoints requieren JWT Bearer token (compartido con el Auth Service).

    ## Roles
    - "ADMIN_ROLE": Acceso total — crear, listar, eliminar pasajeros
    - "DRIVER_ROLE": Solo puede listar pasajeros activos
    - "PASSENGER_ROLE": Solo puede actualizar su propio estado
  version: 1.0.0

servers:
  - url: http://localhost:{port}/urbus/v1
    description: Local development
    variables:
      port:
        default: '3011'

tags:
  - name: Passengers
    description: Gestión de pasajeros
  - name: Groups
    description: Grupos de pasajeros de cada conductor
  - name: Health
    description: Estado del servicio

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: Passenger Service

  /passengers:
    post:
      tags:
        - Passengers
      summary: Crear pasajero
      operationId: createPassenger
      description: Crea un nuevo pasajero. Solo "ADMIN_ROLE".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Nombre del pasajero
                  example: Juan Pérez
            example:
              name: Juan Pérez
      responses:
        '201':
          description: Pasajero creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Pasajero creado
                data:
                  _id: 661f2b3c4e5d6f7a8b9c0d1e
                  name: Juan Pérez
                  userId: a1b2c3d4e5f6g7h8
                  status: AUSENT
                  isActive: true
                  createdAt: "2026-04-27T00:00:00.000Z"
                  updatedAt: "2026-04-27T00:00:00.000Z"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags:
        - Passengers
      summary: Listar pasajeros activos
      operationId: getPassengers
      description: |
        - "ADMIN_ROLE" y "DRIVER_ROLE": todos los pasajeros con "isActive = true".
        - "USER_ROLE" y "PASSENGER_ROLE": solo los compañeros de su grupo activo, con
          "_id", "name" y "groupId" (sin cuenta, asistencia ni motivos de ausencia).
          Lista vacía si no pertenece a un grupo activo.
      responses:
        '200':
          description: Lista de pasajeros activos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Passenger'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /groups/join:
    post:
      tags:
        - Groups
      summary: Unirse a un grupo con su código
      operationId: joinGroup
      description: |
        Solo "USER_ROLE" o "PASSENGER_ROLE". Si la cuenta no tiene perfil de pasajero,
        se crea con "name" (o "Pasajero") y queda en el grupo del código. El grupo y su
        conductor se resuelven solo a partir del código; cualquier groupId/driverId/userId
        enviado se ignora. Un pasajero pertenece a un solo grupo: unirse a otro lo cambia.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  example: A3F9K2
                name:
                  type: string
                  description: Nombre visible si hay que crear el perfil de pasajero
                  example: Diego Pérez
      responses:
        '200':
          description: Unido al grupo
        '400':
          description: Código vacío o no es texto
        '403':
          description: El rol no puede unirse a grupos
        '404':
          description: Código inválido o grupo inactivo/eliminado
        '409':
          description: Ya pertenece a ese grupo (también si dos peticiones llegan a la vez)

  /groups:
    post:
      tags:
        - Groups
      summary: Crear un grupo (conductor)
      operationId: createGroup
      description: |
        Solo "DRIVER_ROLE". El dueño es siempre el conductor del token y el código
        de unión se genera en el servidor (driverId/code del body se ignoran).
        Se rechaza si el conductor ya tiene tantos grupos activos como su límite
        efectivo (el propio asignado por un admin o, si no tiene, el general;
        por defecto 2). Los grupos inactivos o eliminados no cuentan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Ruta mañana
      responses:
        '201':
          description: Grupo creado con su código único
        '400':
          description: Nombre vacío o no es texto
        '403':
          description: El rol no es conductor, o se alcanzó el límite de grupos
          content:
            application/json:
              example:
                success: false
                message: Alcanzaste el límite de 2 grupos activos por conductor. Desactiva o elimina un grupo, o solicita a un administrador un límite mayor
                error: GROUP_LIMIT_REACHED
                data:
                  maxGroups: 2
                  activeGroups: 2

  /groups/settings:
    get:
      tags:
        - Groups
      summary: Configuración general de grupos (admin)
      operationId: getGroupSettings
      responses:
        '200':
          description: Configuración actual
          content:
            application/json:
              example:
                success: true
                data:
                  maxGroupsPerDriver: 2
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
        - Groups
      summary: Cambiar el límite general de grupos por conductor (admin)
      operationId: updateGroupSettings
      description: |
        Aplica a los conductores sin un límite propio. Bajarlo no elimina grupos
        existentes: solo impide crear o reactivar más hasta quedar por debajo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - maxGroupsPerDriver
              properties:
                maxGroupsPerDriver:
                  type: integer
                  minimum: 0
                  maximum: 100
                  example: 3
      responses:
        '200':
          description: Límite general actualizado
        '400':
          description: No es un entero entre 0 y 100
        '403':
          $ref: '#/components/responses/Forbidden'

  /groups/limit/me:
    get:
      tags:
        - Groups
      summary: Límite efectivo del conductor del token
      operationId: getMyGroupLimit
      responses:
        '200':
          description: Límite y grupos activos
          content:
            application/json:
              example:
                success: true
                data:
                  driverId: d1r2v3r4
                  maxGroups: 2
                  isCustom: false
                  defaultMaxGroups: 2
                  activeGroups: 1
        '403':
          $ref: '#/components/responses/Forbidden'

  /groups/limit/{driverId}:
    parameters:
      - name: driverId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Groups
      summary: Límite efectivo de un conductor (admin o el propio conductor)
      operationId: getGroupLimit
      responses:
        '200':
          description: Igual que /groups/limit/me
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
        - Groups
      summary: Asignar un límite propio a un conductor (admin)
      operationId: setGroupLimit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - maxGroups
              properties:
                maxGroups:
                  type: integer
                  minimum: 0
                  maximum: 100
      responses:
        '200':
          description: Límite asignado
        '400':
          description: No es un entero entre 0 y 100
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
        - Groups
      summary: Quitar el límite propio; el conductor vuelve al general (admin)
      operationId: resetGroupLimit
      responses:
        '200':
          description: El conductor usa el límite general
        '403':
          $ref: '#/components/responses/Forbidden'

  /groups/access:
    get:
      tags:
        - Groups
      summary: Acceso a grupos del usuario del token
      operationId: getGroupAccess
      description: |
        Uso interno de post-service y location-service, que reenvían el token del
        usuario. Exento del rate limit global.
      responses:
        '200':
          description: Acceso del usuario
          content:
            application/json:
              example:
                success: true
                data:
                  userId: a1b2c3d4e5f6g7h8
                  role: USER_ROLE
                  ownedGroupIds: []
                  memberGroupId: 661f2b3c4e5d6f7a8b9c0d1e
                  driverId: d1r2v3r4
        '401':
          $ref: '#/components/responses/Unauthorized'

  /passengers/{id}/status:
    patch:
      tags:
        - Passengers
      summary: Actualizar estado del pasajero
      operationId: updatePassengerStatus
      description: |
        Actualiza el estado de presencia del pasajero.
        - "ADMIN_ROLE" y "DRIVER_ROLE": pueden actualizar cualquier pasajero
        - "PASSENGER_ROLE": solo puede actualizar su propio estado
      parameters:
        - $ref: '#/components/parameters/PassengerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [PRESENT, AUSENT]
                  description: Nuevo estado del pasajero
                  example: PRESENT
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Estado actualizado
                data:
                  _id: 661f2b3c4e5d6f7a8b9c0d1e
                  name: Juan Pérez
                  userId: a1b2c3d4e5f6g7h8
                  status: PRESENT
                  isActive: true
                  createdAt: "2026-04-27T00:00:00.000Z"
                  updatedAt: "2026-04-27T00:00:00.000Z"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /passengers/{id}:
    delete:
      tags:
        - Passengers
      summary: Eliminar pasajero (soft delete)
      operationId: deletePassenger
      description: Marca el pasajero como inactivo ("isActive = false"). Solo "ADMIN_ROLE".
      parameters:
        - $ref: '#/components/parameters/PassengerId'
      responses:
        '200':
          description: Pasajero eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Pasajero eliminado
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido por el Auth Service

  parameters:
    PassengerId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: ID del pasajero (MongoDB ObjectId)
      example: 661f2b3c4e5d6f7a8b9c0d1e

  schemas:
    Passenger:
      type: object
      properties:
        _id:
          type: string
          description: ID del pasajero (MongoDB ObjectId)
          example: 661f2b3c4e5d6f7a8b9c0d1e
        name:
          type: string
          example: Juan Pérez
        userId:
          type: string
          description: ID del usuario del Auth Service
          example: a1b2c3d4e5f6g7h8
        status:
          type: string
          enum: [PRESENT, AUSENT]
          default: AUSENT
          example: AUSENT
        isActive:
          type: boolean
          default: true
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-04-27T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-04-27T00:00:00.000Z"

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/Passenger'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          type: string
          nullable: true

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Error de validación
        errors:
          type: array
          items:
            type: object
            properties:
              account:
                type: string
                example: name
              message:
                type: string
                example: Path "name" is required

  responses:
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing:
              value:
                message: Token requerido
            invalid:
              value:
                success: false
                message: Token inválido
                error: INVALID_TOKEN
            expired:
              value:
                success: false
                message: Token expirado
                error: TOKEN_EXPIRED

    Forbidden:
      description: Sin permisos para esta operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: No tiene permisos para crear pasajeros

    NotFound:
      description: Pasajero no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Pasajero no encontrado

    ValidationError:
      description: Error de validación o ID inválido
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ValidationErrorResponse'
              - $ref: '#/components/schemas/ErrorResponse'
          examples:
            validationError:
              value:
                success: false
                message: Error de validación
                errors:
                  - account: name
                    message: Path "name" is required
            invalidId:
              value:
                success: false
                message: Formato de ID inválido
                error: INVALID_ID
            duplicate:
              value:
                success: false
                message: name ya existe
                error: DUPLICATE_ACCOUNT

    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Error interno del servidor
            error: INTERNAL_SERVER_ERROR